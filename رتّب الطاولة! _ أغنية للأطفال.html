<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتّب الطاولة! | أغنية للأطفال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ea;--fg:#3b2a1a;--card:#ffffff;--acc:#ff7a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--fg:#fbeedd;--card:#2a2219;--acc:#ff9a55}}
:root[data-theme="dark"]{--bg:#1d1812;--fg:#fbeedd;--card:#2a2219;--acc:#ff9a55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Cairo',Tahoma,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:860px;padding:16px}
h1{font-size:1.5rem;margin:4px 0 12px;text-align:center}
.stage{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);background:#bfe8ff}
svg{display:block;width:100%;height:auto}
.it{transition:transform 1.4s cubic-bezier(.5,-.4,.4,1.3),opacity .4s 1.1s}
.it.go{opacity:0}
.girl{animation:bob .5s ease-in-out infinite alternate;transform-origin:700px 400px}
@keyframes bob{to{transform:translateY(-8px) rotate(2deg)}}
.arm{animation:wave .45s ease-in-out infinite alternate;transform-origin:672px 318px}
@keyframes wave{to{transform:rotate(-25deg)}}
#cloth{opacity:0}
#cloth.on{opacity:1;animation:wipe .9s ease-in-out infinite alternate}
@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(340px)}}
.sp{opacity:0;font-size:34px;fill:#ffc400}
.fin .sp{animation:tw .8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
.sp{transform-box:fill-box;transform-origin:center}
#cap{position:absolute;inset:auto 0 0 0;padding:10px 14px;background:rgba(40,25,10,.72);color:#fff;font-weight:800;font-size:clamp(1rem,3.6vw,1.6rem);text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center}
#big{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:34px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bar{height:8px;background:rgba(127,127,127,.3);border-radius:8px;margin:12px 0;overflow:hidden}
#fill{height:100%;width:0;background:var(--acc)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.row button{font:inherit;font-weight:800;background:var(--card);color:var(--fg);border:2px solid var(--acc);border-radius:12px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🧽 رتّب الطاولة! — أغنية للأطفال</h1>
<div class="stage" id="stage">
<svg viewBox="0 0 800 450" role="img" aria-label="فيديو متحرك لطفلة ترتب الطاولة">
 <rect width="800" height="450" fill="#cfeeff"/>
 <rect y="390" width="800" height="60" fill="#e9b872"/>
 <circle cx="90" cy="70" r="34" fill="#ffd54a"/>
 <rect x="300" y="40" width="200" height="120" rx="10" fill="#fff" stroke="#9ad" stroke-width="6"/><line x1="400" y1="40" x2="400" y2="160" stroke="#9ad" stroke-width="5"/>
 <!-- bins -->
 <rect x="30" y="285" width="130" height="50" rx="8" fill="#7bc67e"/><text x="95" y="318" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">الصينية</text>
 <rect x="30" y="345" width="130" height="50" rx="8" fill="#6aa7ff"/><text x="95" y="378" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">الصندوق</text>
 <!-- table -->
 <rect x="190" y="262" width="420" height="26" rx="8" fill="#a8672f"/>
 <rect x="215" y="288" width="22" height="104" fill="#8a5222"/><rect x="563" y="288" width="22" height="104" fill="#8a5222"/>
 <!-- items -->
 <g class="it" id="i1" data-d="-160,70"><rect x="240" y="226" width="30" height="36" rx="6" fill="#ff6b6b"/><rect x="270" y="234" width="9" height="18" rx="4" fill="none" stroke="#ff6b6b" stroke-width="4"/></g>
 <g class="it" id="i2" data-d="-245,62"><ellipse cx="340" cy="256" rx="38" ry="8" fill="#fff" stroke="#bbb" stroke-width="3"/></g>
 <g class="it" id="i3" data-d="-345,125"><rect x="410" y="236" width="60" height="26" rx="3" fill="#9b6cff"/><rect x="414" y="240" width="52" height="4" fill="#fff"/></g>
 <g class="it" id="i4" data-d="-425,135"><rect x="500" y="230" width="9" height="32" fill="#ff4d8d"/><rect x="513" y="230" width="9" height="32" fill="#35c46b"/><rect x="526" y="230" width="9" height="32" fill="#ffb300"/></g>
 <g class="it" id="i5" data-d="-485,135"><rect x="562" y="238" width="24" height="24" rx="3" fill="#4dabf7"/><text x="574" y="257" font-size="16" text-anchor="middle" fill="#fff" font-weight="800">A</text></g>
 <!-- cloth -->
 <g id="cloth"><rect x="205" y="243" width="64" height="20" rx="8" fill="#3fa9ff"/></g>
 <!-- girl -->
 <g class="girl">
  <rect x="682" y="360" width="12" height="34" fill="#f1b98a"/><rect x="706" y="360" width="12" height="34" fill="#f1b98a"/>
  <path d="M700 300 L660 362 L740 362 Z" fill="#ff8a24"/>
  <g class="arm"><rect x="640" y="316" width="36" height="9" rx="4" fill="#f1b98a" transform="rotate(-20 672 320)"/></g>
  <rect x="728" y="318" width="26" height="9" rx="4" fill="#f1b98a" transform="rotate(30 728 320)"/>
  <circle cx="700" cy="280" r="30" fill="#f6c9a0"/>
  <path d="M668 280 Q668 244 700 246 Q732 244 732 280 Q716 262 700 262 Q684 262 668 280Z" fill="#6b3b1a"/>
  <circle cx="689" cy="282" r="3.5" fill="#333"/><circle cx="711" cy="282" r="3.5" fill="#333"/>
  <path d="M690 293 Q700 303 710 293" stroke="#c0392b" stroke-width="3" fill="none"/>
 </g>
 <g id="sps"><text class="sp" x="250" y="215">✦</text><text class="sp" x="360" y="205">✦</text><text class="sp" x="470" y="215">✦</text><text class="sp" x="560" y="205">✦</text></g>
</svg>
<div id="cap">اضغط تشغيل ▶</div>
<button id="big" aria-label="تشغيل">▶</button>
</div>
<div class="bar"><div id="fill"></div></div>
<div class="row"><button id="pp">⏸ إيقاف</button><button id="rs">↺ من الأول</button><button id="snd">🔊 الموسيقى: تعمل</button></div>
</main>
<script>
const L=["يلا يا أصحاب، الطاولة مليانة حاجات! 🎵","الكوب كوب، نشيله ونحطه في الصينية","والطبق كمان، واحد واتنين! 🍽️","الكتاب في الصندوق، بالراحة بالراحة 📖","الألوان والمكعّب، كلٌّ في مكانه 🖍️","امسح امسح، يمين وشمال، لمّع الطاولة! 🧽","الطاولة نضيفة وتبرق! برافو علينا! ⭐"];
const S=5,T=L.length*S;let t=0,run=false,last=0,step=-1,sound=true,ctx=null,beat=-1;
const $=id=>document.getElementById(id),cap=$('cap'),st=$('stage');
const notes=[262,330,392,330,294,349,440,349];
function tone(f,d){if(!sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function apply(n){step=n;cap.textContent=L[n];
 for(let i=1;i<=5;i++){const e=$('i'+i),go=(n>=1&&i<=n&&i<=4)||(n>=4&&i==5);
  if(go){const d=e.dataset.d.split(',');e.style.transform=`translate(${d[0]}px,${d[1]}px)`;e.classList.add('go')}else{e.style.transform='';e.classList.remove('go')}}
 $('cloth').classList.toggle('on',n==5);st.classList.toggle('fin',n==6)}
function reset(){t=0;beat=-1;apply(0)}
function frame(now){if(run){t+=(now-last)/1000;last=now;if(t>=T){t=T-.01;run=false;sync();}
 const n=Math.min(L.length-1,Math.floor(t/S));if(n!==step)apply(n);
 const b=Math.floor(t*2);if(b!==beat){beat=b;tone(notes[b%8],.4)}
 $('fill').style.width=(t/T*100)+'%'}requestAnimationFrame(frame)}
function sync(){$('big').style.display=run?'none':'block';$('pp').textContent=run?'⏸ إيقاف':'▶ تشغيل'}
function play(){if(t>=T-.05)reset();run=true;last=performance.now();sync()}
$('big').onclick=play;$('pp').onclick=()=>{run?(run=false,sync()):play()};
$('rs').onclick=()=>{reset();play()};
$('snd').onclick=e=>{sound=!sound;e.target.textContent='🔊 الموسيقى: '+(sound?'تعمل':'متوقفة')};
reset();cap.textContent='اضغط تشغيل ▶';sync();requestAnimationFrame(frame);
</script>
</body>
</html>
